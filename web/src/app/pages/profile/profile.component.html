<section class="profile" *ngIf="user; else noUser">
    <h2>Mi perfil</h2>
    <p><strong>Nombre:</strong> {{ user.firstName }} {{ user.lastName }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Teléfono:</strong> {{ user.phone || '—' }}</p>
    <p><strong>Cédula:</strong> {{ user.documentId || '—' }}</p>
  
    <button (click)="logout()" class="btn btn-ghost">Cerrar sesión</button>
  </section>
  
  <ng-template #noUser>
    <p>No has iniciado sesión.</p>
  </ng-template>
