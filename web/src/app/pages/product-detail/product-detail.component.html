<section class="detail" *ngIf="product; else notFound">
    <a routerLink="/catalogo" class="back">← Volver al catálogo</a>
  
    <div class="card">
      <div class="gallery">
        <div class="main-image">
          <img
            [src]="currentImage || fallbackImage"
            [alt]="product.name"
            class="main-photo"
          />
        </div>
        <div class="thumbnails" *ngIf="photos.length > 0">
          <button
            type="button"
            class="thumb"
            *ngFor="let photo of photos; let i = index"
            [class.active]="i === activePhotoIndex"
            (click)="selectPhoto(i)"
          >
            <img
              [src]="photo.url || fallbackImage"
              [alt]="product.name + ' foto ' + (i + 1)"
            />
          </button>
        </div>
      </div>
      <div class="info">
        <h2>{{ product.name }}</h2>
        <p class="price">{{ formatPrice(currentPrice) }}</p>
        <p class="desc">{{ currentDescription }}</p>

        <div class="size-selector" *ngIf="availableSizes.length; else singleSize" >
          <label for="size">Tamaño:</label>
          <select
            id="size"
            class="size-select"
            [(ngModel)]="selectedSize"
            (ngModelChange)="onSizeChange($event)"
            translate="no"
          >
            <option *ngFor="let size of availableSizes" [value]="size" translate="no">
              {{ sizeLabel(size) }}
            </option>
          </select>
        </div>

        <div class="add-to-cart" *ngIf="!isInCart">
          <div class="quantity-selector">
            <label for="quantity">Cantidad:</label>
            <input 
              type="number" 
              id="quantity"
              [(ngModel)]="quantity" 
              min="1" 
              max="99"
              class="quantity-input"
            />
          </div>
          <button 
            class="add-btn"
            (click)="addToCart()"
            [disabled]="quantity < 1"
          >
            🛒 Añadir al carrito
          </button>
        </div>

        <div class="in-cart" *ngIf="isInCart">
          <p class="success-message">✅ Producto añadido al carrito</p>
          <a routerLink="/carrito" class="view-cart-btn">
            Ver carrito
          </a>
        </div>
      </div>
    </div>
  </section>
  
  <ng-template #notFound>
    <p>No encontramos este producto. <a routerLink="/catalogo">Volver</a></p>
  </ng-template>

  <ng-template #singleSize>
    <p class="single-size">Tamaño único.</p>
  </ng-template>
