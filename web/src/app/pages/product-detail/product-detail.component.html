<section class="detail" *ngIf="product; else notFound">
    <a routerLink="/catalogo" class="back">← Volver al catálogo</a>
  
    <div class="card">
      <img [src]="currentImage" [alt]="product.name" />
      <div class="info">
        <h2>{{ product.name }}</h2>
        <p class="price">{{ formatPrice(currentPrice) }}</p>
        <p class="desc">{{ currentDescription }}</p>

        <div class="size-selector">
          <label for="size">Talla:</label>
          <select
            id="size"
            class="size-select"
            [(ngModel)]="selectedSize"
            (ngModelChange)="onSizeChange($event)"
          >
            <option *ngFor="let size of availableSizes" [value]="size">
              {{ size }}
            </option>
          </select>
        </div>

        <div class="add-to-cart" *ngIf="!isInCart">
          <div class="quantity-selector">
            <label for="quantity">Cantidad:</label>
            <input 
              type="number" 
              id="quantity"
              [(ngModel)]="quantity" 
              min="1" 
              max="99"
              class="quantity-input"
            />
          </div>
          <button 
            class="add-btn"
            (click)="addToCart()"
            [disabled]="quantity < 1"
          >
            🛒 Añadir al carrito
          </button>
        </div>

        <div class="in-cart" *ngIf="isInCart">
          <p class="success-message">✅ Producto añadido al carrito</p>
          <a routerLink="/carrito" class="view-cart-btn">
            Ver carrito
          </a>
        </div>
      </div>
    </div>
  </section>
  
  <ng-template #notFound>
    <p>No encontramos este producto. <a routerLink="/catalogo">Volver</a></p>
  </ng-template>
