<section class="register">
  <div class="register-card">
    <h2>Crea tu cuenta</h2>
    <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="row">
        <label>Nombre
          <input type="text" formControlName="firstName" autocomplete="given-name" />
        </label>

        <label>Apellidos
          <input type="text" formControlName="lastName" autocomplete="family-name" />
        </label>
      </div>

      <label>Correo electrónico
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <div class="row">
        <label>Teléfono
          <input type="tel" formControlName="phone" autocomplete="tel" />
        </label>

        <label>Cédula
          <input type="text" formControlName="documentId" autocomplete="off" />
        </label>
      </div>



      <div class="row">
        <label>Contraseña
          <input type="password" formControlName="password" autocomplete="new-password" />
          <ul class="password-reqs" *ngIf="form.get('password')?.touched || form.get('password')?.dirty">
            <li [class.met]="hasMinLength">Mínimo 8 caracteres</li>
            <li [class.met]="hasUpperCase">Al menos una mayúscula</li>
            <li [class.met]="hasLowerCase">Al menos una minúscula</li>
            <li [class.met]="hasNumber">Al menos un número</li>
            <li [class.met]="hasSpecial">Al menos un carácter especial</li>
          </ul>
          <div class="error" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('weakPassword')">
            La contraseña no cumple con los requisitos mínimos.
          </div>
        </label>

        <label>Confirmar contraseña
          <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
        </label>
      </div>

      <button type="submit" [disabled]="form.invalid">Registrarme</button>
    </form>

    <p class="login-hint">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </div>
</section>
