<section class="login">
  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label>
        Correo electrónico
        <input type="email" formControlName="email" placeholder="tucorreo@ejemplo.com" />
      </label>
      <div class="error" *ngIf="emailCtrl?.touched && emailCtrl?.invalid">
        Ingresa un correo válido.
      </div>
  
      <label>
        Contraseña
        <input type="password" formControlName="password" placeholder="********" />
      </label>
      <div class="error" *ngIf="passwordCtrl?.touched && passwordCtrl?.invalid">
        Mínimo 8 caracteres.
      </div>
  
      <button type="submit" [disabled]="form.invalid">Entrar</button>
    </form>
  
    <p class="register-hint">
      ¿No tienes cuenta? 
      <a routerLink="/registro">Regístrate aquí</a>
    </p>
  </div>
  </section>
