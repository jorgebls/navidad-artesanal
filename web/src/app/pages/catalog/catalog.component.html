<section class="catalog">
    <h2>Catálogo</h2>
  
    <div class="grid" *ngIf="products.length; else empty">
      <a class="card" *ngFor="let p of products" [routerLink]="['/producto', p.id]">
        <img
          [src]="p.image"
          [alt]="p.name"
          loading="lazy"
          (error)="onImgError($event)"  />
        <h3>{{ p.name }}</h3>
        <p class="price">
          {{ priceForDefaultSize(p) | currency:'COP':'symbol-narrow':'1.0-0':'es-CO' }}
          <span class="size-tag">Talla M</span>
        </p>
      </a>
    </div>
  
    <ng-template #empty>
      <p>No hay productos cargados.</p>
    </ng-template>
  </section>
