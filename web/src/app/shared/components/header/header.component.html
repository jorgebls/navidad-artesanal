<header class="header">
    <div class="wrap">
      <a routerLink="/" class="brand" aria-label="Inicio Navidad Artesanal">
        <img src="assets/img/logo.png" alt="Navidad Artesanal" class="brand-logo">
        <span class="brand-name">Navidad Artesanal</span>
      </a>
  
      <nav class="nav" aria-label="Principal">
        <a routerLink="/catalogo" routerLinkActive="active" class="nav-link">Catálogo</a>
      
        <a routerLink="/carrito" routerLinkActive="active" class="nav-link">
          Carrito
          <span class="badge" *ngIf="count > 0">{{ count }}</span>
        </a>
      
        <ng-container *ngIf="!user; else loggedIn">
          <a routerLink="/login" routerLinkActive="active" class="btn btn-ghost">Entrar</a>
        </ng-container>
      
        <ng-template #loggedIn>
            <a routerLink="/perfil" class="btn btn-solid">Mi perfil</a>
          </ng-template>
      </nav>
    </div>
  </header>
